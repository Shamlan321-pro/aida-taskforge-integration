{% extends "templates/web.html" %}

{% block title %}AIDA AI Assistant{% endblock %}

{% block page_content %}
<div class="aida-chat-container">
    <div class="chat-header">
        <h3><i class="fa fa-robot"></i> AIDA AI Assistant</h3>
        <div class="chat-controls">
            <button class="btn btn-sm btn-secondary" id="clear-chat">Clear Chat</button>
            <button class="btn btn-sm btn-primary" id="settings-btn">Settings</button>
        </div>
    </div>
    
    <div class="chat-messages" id="chat-messages">
        <div class="welcome-message">
            <p>Welcome to AIDA! I'm your AI assistant for ERPNext. How can I help you today?</p>
        </div>
    </div>
    
    <div class="chat-input-container">
        <div class="input-group">
            <input type="text" class="form-control" id="chat-input" placeholder="Ask me anything about your ERPNext system..." disabled>
            <div class="input-group-append">
                <button class="btn btn-primary" id="send-btn" disabled>
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <div class="connection-status" id="connection-status">
            <span class="status-indicator disconnected"></span>
            <span class="status-text">Disconnected</span>
        </div>
    </div>
</div>

<script>
    window.aidaChatInterface = new AidaChatInterface();
</script>
{% endblock %}
